name: openIMIS mobile CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  OPENIMIS_USERNAME: Admin
  OPENIMIS_PASSWORD: admin123

jobs:
  ios:
    name: iOS (iPhone 17 simulator)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm ci
      - name: Install Appium + XCUITest driver
        run: |
          npm install -g appium
          appium driver install xcuitest
      - name: Boot iPhone 17 simulator
        run: |
          xcrun simctl boot "iPhone 17"
          xcrun simctl bootstatus "iPhone 17" -b
      - name: Start Appium
        run: |
          appium --address 127.0.0.1 --port 4723 &
          sleep 5
      - name: Run iOS tests
        run: npm run test:ios

  android:
    name: Android (Galaxy S25 emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm ci
      - name: Install Appium + UiAutomator2 driver
        run: |
          npm install -g appium
          appium driver install uiautomator2
      - name: Start emulator (API 35)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: echo "Emulator ready"
      - name: Start Appium
        run: |
          appium --address 127.0.0.1 --port 4723 &
          sleep 10
      - name: Run Android tests
        run: npm run test:android
